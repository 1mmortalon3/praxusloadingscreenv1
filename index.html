<head>
<meta charset="utf-8">

<title>Praxus Gaming | Jedi vs Sith</title>
<style>
html,body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:linear-gradient(90deg,#081a2c 0%,#05070b 50%,#2c0808 100%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

* { box-sizing:border-box; }

#bg {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  z-index:0;
  user-select:none;
  -webkit-user-drag:none;
}

#shade {
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(circle at center, rgba(0,0,0,0) 44%, rgba(0,0,0,.38) 100%),
    linear-gradient(to bottom, rgba(0,0,0,.08), rgba(0,0,0,0) 30%, rgba(0,0,0,.06) 68%, rgba(0,0,0,.55));
}

#panel {
  position:fixed;
  left:50%;
  bottom:4vh;
  transform:translateX(-50%);
  width:min(860px,84vw);
  z-index:3;
  text-align:center;
}

#status {
  margin-bottom:8px;
  font-size:clamp(12px,1vw,16px);
  font-weight:700;
  letter-spacing:.20em;
  text-transform:uppercase;
  text-shadow:0 2px 14px rgba(0,0,0,.95);
}

#details {
  min-height:18px;
  margin-bottom:12px;
  font-size:clamp(10px,.8vw,13px);
  letter-spacing:.12em;
  text-transform:uppercase;
  color:rgba(255,255,255,.74);
  text-shadow:0 2px 10px rgba(0,0,0,.95);
}

#track {
  width:100%;
  height:8px;
  padding:2px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.26);
  background:rgba(0,4,10,.62);
  box-shadow:0 0 18px rgba(0,0,0,.85), inset 0 0 8px rgba(0,0,0,.7);
}

#bar {
  width:8%;
  height:100%;
  background:linear-gradient(90deg,#158fff 0%,#e9f8ff 50%,#ff3c3c 100%);
  box-shadow:0 0 15px rgba(71,172,255,.7);
  transition:width .25s ease;
}

#tagline {
  margin-top:12px;
  font-size:clamp(9px,.68vw,11px);
  letter-spacing:.16em;
  text-transform:uppercase;
  color:rgba(255,255,255,.62);
  text-shadow:0 2px 8px rgba(0,0,0,.95);
}

#musicBox {
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:4;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(2,7,13,.62);
  box-shadow:0 4px 20px rgba(0,0,0,.45);
  font-size:10px;
  letter-spacing:.09em;
  text-transform:uppercase;
}

#musicText {
  color:rgba(255,255,255,.72);
  white-space:nowrap;
}

#musicButton {
  display:none;
  border:1px solid rgba(255,255,255,.30);
  background:rgba(255,255,255,.10);
  color:#fff;
  padding:5px 8px;
  cursor:pointer;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

#musicButton:hover {
  background:rgba(255,255,255,.18);
}

@media (max-width:720px) {
  #panel { width:90vw; bottom:3vh; }
  #musicBox { right:10px; bottom:10px; }
  #musicText { display:none; }
}

#bgError {
  display:none;
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  padding:8px 12px;
  background:rgba(90,0,0,.85);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
}
html[data-bg-error="1"] #bgError { display:block; }

</style>
</head>

    var raw = atob(b64);
    var bytes = new Uint8Array(raw.length);

    for (var i = 0; i < raw.length; i++) {
      bytes[i] = raw.charCodeAt(i);
    }

    var blob = new Blob([bytes], { type: "image/jpeg" });
    var blobUrl = URL.createObjectURL(blob);
    var bg = document.getElementById("bg");

    bg.onload = function() {
      document.documentElement.setAttribute("data-bg-loaded", "1");
    };

    bg.onerror = function() {
      document.documentElement.setAttribute("data-bg-error", "1");

<script>
(function () {
  var statusEl = document.getElementById("status");
  var detailsEl = document.getElementById("details");
  var barEl = document.getElementById("bar");
  var music = document.getElementById("music");
  var musicButton = document.getElementById("musicButton");

  var totalFiles = 0;
  var downloadedFiles = 0;
  var fallbackProgress = 8;

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function setProgress(v) {
    barEl.style.width = clamp(v, 2, 100) + "%";
  }

  function text(v) {
    return (v === undefined || v === null) ? "" : String(v).replace(/\s+/g, " ").trim();
  }

  function showMusicButton() {
    musicButton.style.display = "inline-block";
  }

  function hideMusicButton() {
    musicButton.style.display = "none";
  }

  function tryMusic() {
    if (!music) return;
    music.volume = 0.42;

    var p;
    try {
      p = music.play();
    } catch (e) {
      showMusicButton();
      return;
    }

    if (p && typeof p.then === "function") {
      p.then(hideMusicButton).catch(showMusicButton);
    } else {
      // Older Chromium/CEF may not return a Promise.
      setTimeout(function () {
        if (music.paused) showMusicButton();
        else hideMusicButton();
      }, 700);
    }
  }

  musicButton.addEventListener("click", function () {
    tryMusic();
  });

  // Try immediately and again after the page is fully ready.
  tryMusic();
  window.addEventListener("load", tryMusic);
  window.addEventListener("focus", tryMusic);

  // Any user input can unlock Chromium autoplay.
  document.addEventListener("click", tryMusic, { once:true });
  document.addEventListener("keydown", tryMusic, { once:true });

  // Garry's Mod loading-screen callbacks.
  window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
    var server = text(servername) || "Praxus Gaming";
    var map = text(mapname);
    var gm = text(gamemode);

    statusEl.textContent = "Connecting to " + server;

    var bits = [];
    if (gm) bits.push(gm);
    if (map) bits.push(map);
    detailsEl.textContent = bits.length ? bits.join(" • ") : "Jedi vs Sith Roleplay";

    setProgress(10);
    tryMusic();
  };

  window.DownloadingFile = function(fileName) {
    downloadedFiles++;
    var f = text(fileName);
    statusEl.textContent = "Downloading Server Content";
    detailsEl.textContent = f || "Preparing required files";

    if (totalFiles > 0) {
      setProgress(10 + (downloadedFiles / totalFiles) * 76);
    } else {
      setProgress(Math.min(86, 12 + downloadedFiles * 1.6));
    }
  };

  window.SetFilesTotal = function(total) {
    totalFiles = parseInt(total, 10) || 0;
  };

  window.SetFilesNeeded = function(needed) {
    var n = parseInt(needed, 10);
    if (!totalFiles || isNaN(n)) return;
    var done = Math.max(0, totalFiles - n);
    setProgress(10 + (done / totalFiles) * 76);
  };

  window.SetStatusChanged = function(s) {
    s = text(s);
    if (!s) return;

    statusEl.textContent = s;
    var q = s.toLowerCase();

    if (q.indexOf("retriev") !== -1) setProgress(88);
    else if (q.indexOf("send") !== -1) setProgress(92);
    else if (q.indexOf("start") !== -1) setProgress(96);
    else if (q.indexOf("ready") !== -1 || q.indexOf("complete") !== -1) setProgress(100);
  };

  // Visual fallback so the page never looks frozen before callbacks arrive.
  setInterval(function () {
    if (downloadedFiles === 0 && fallbackProgress < 22) {
      fallbackProgress += 0.25;
      setProgress(fallbackProgress);
    }
  }, 1000);
})();
</script>
